<!DOCTYPE html>
<html>
<head>
  <title>Frameset Table Example</title>
</head>
<frameset cols="300px, 300px, 300px">
    <frameset rows="200px, 200px, 400px, 200px">
        <frame name="Zoology" src="Zoology.html" marginwidth = 30 marginheight=20 scrolling="yes">
        <frame name="Botany" src="Botany.html" marginwidth = 30 marginheight=20 scrolling="yes">
        <frame name="Entomology" src="Entomology.html" marginwidth = 30 marginheight=20 scrolling="yes">
        <frame name="Toxicology" src="Toxicology.html" marginwidth = 30 marginheight=20 scrolling="yes">
      </frameset>
    <frameset rows="600px, 400px">
      <frame name="Welcome" src="Welcome.html" marginwidth = 30 marginheight=20 scrolling="yes">
      <frame name="Heading" src="Heading.html" marginwidth = 30 marginheight=20 scrolling="yes">
    </frameset>
    <frameset rows="200px, 600px, 200px">
      <frame name="Maths" src="Maths.html" marginwidth = 30 marginheight=20 scrolling="yes">
      <frame name="Physics" src="Physics.html" marginwidth = 30 marginheight=20 scrolling="yes">
      <frame name="Computer" src="Computer.html" marginwidth = 30 marginheight=20 scrolling="yes">
    </frameset>
</frameset>
</html>
